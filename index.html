<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家庭財務儀表板</title>
  <!-- 載入 Tailwind CSS 與 React 函式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <!-- 主程式腳本 -->
  <script type="text/babel">
    const { useState } = React;

    function App() {
      // 預設 View 模式: joint (合併), mine (我的), spouse (先生)
      const [viewMode, setViewMode] = useState('joint');
      // 資產隱私摺疊狀態 (預設關閉)
      const [showAssetDetails, setShowAssetDetails] = useState(false);
      
      // 每月信用卡估算狀態
      const [myCard, setMyCard] = useState(35000);
      const [spouseCard, setSpouseCard] = useState(40000);

      // 核心數據 (已更新為 30% 所得稅級距與 114-115 年最新收入評估)
      const data = {
        houseName: "森之丘後山埤社區 122 號 4 樓",
        mortgageRemaining: 16000000, // 剩餘 1600 萬
        mortgageRate: 0.02185, // 2.185%
        rentIncome: 42000, // 房屋出租收益
        quartersFee: 3810, // 官舍管理費
        mySalary: 250000, // 估算平均 (20~30萬)
        spouseSalary: 275000, // 估算平均 (25~30萬+)

        // 綜合所得稅 (30% 級距，年度預估 $540,000，合併申報先生 3/5、我 2/5)
        totalIncomeTax: 540000,

        // 共同公共稅費 (房屋/地價稅出租後金額 + 車輛 + 火險)
        jointTaxes: {
          houseTaxRental: 32535,
          landTaxRental: 12060,
          carTaxesAndInsurance: 25506,
          fireInsurance: 2186
        },

        // 我的獨立支出 (所得稅 2/5 + 牙材/年費/研討會 + 個人保費/儲蓄)
        myTaxesAndFees: {
          incomeTaxShare: 540000 * (2/5), // $216,000 ($18,000/月)
          workAndMaterialFees: 66000, // 牙材 ($36,000) + 年費 ($10,000) + 研討會 ($20,000)
          insuranceAndSavings: 143640 // 個人保費/儲蓄金
        },

        // 先生的獨立支出 (所得稅 3/5 + 個人保費/規費)
        spouseTaxesAndFees: {
          incomeTaxShare: 540000 * (3/5), // $324,000 ($27,000/月)
          workAndInsurance: 150000 // 先生個人保費與專業規費
        }
      };

      // 計算共同年度稅費總和與月平攤
      const jointAnnualTotal = Object.values(data.jointTaxes).reduce((a, b) => a + b, 0);
      const jointMonthlyReserve = Math.round(jointAnnualTotal / 12);

      // 計算我的年度總支出與月平攤
      const myAnnualTotal = Object.values(data.myTaxesAndFees).reduce((a, b) => a + b, 0);
      const myMonthlyReserve = Math.round(myAnnualTotal / 12);

      // 計算先生的年度總支出與月平攤
      const spouseAnnualTotal = Object.values(data.spouseTaxesAndFees).reduce((a, b) => a + b, 0);
      const spouseMonthlyReserve = Math.round(spouseAnnualTotal / 12);

      // 計算房貸月利息 (1600萬 * 2.185% / 12)
      const monthlyInterest = Math.round((data.mortgageRemaining * data.mortgageRate) / 12);
      // 以房養房每月淨收益
      const netRentBenefit = data.rentIncome - monthlyInterest;

      // 動態計算當前視角數據
      const currentIncome = viewMode === 'joint' 
        ? data.mySalary + data.spouseSalary + data.rentIncome
        : (viewMode === 'mine' ? data.mySalary : data.spouseSalary);

      const currentCard = viewMode === 'joint' 
        ? myCard + spouseCard 
        : (viewMode === 'mine' ? myCard : spouseCard);

      // 依視角計算固定與預提費用
      const currentFixedExpense = viewMode === 'joint'
        ? data.quartersFee + monthlyInterest + jointMonthlyReserve + myMonthlyReserve + spouseMonthlyReserve
        : (viewMode === 'mine' 
            ? Math.round(data.quartersFee / 2) + Math.round(monthlyInterest / 2) + Math.round(jointMonthlyReserve / 2) + myMonthlyReserve
            : Math.round(data.quartersFee / 2) + Math.round(monthlyInterest / 2) + Math.round(jointMonthlyReserve / 2) + spouseMonthlyReserve);

      const currentSavings = currentIncome - currentFixedExpense - currentCard;

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 font-sans text-slate-800">
          {/* Header & 視角切換器 */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h1 className="text-2xl font-bold text-slate-900">家庭財務戰略儀表板</h1>
              
              {/* 隱私可折疊資產資訊 */}
              <button 
                onClick={() => setShowAssetDetails(!showAssetDetails)}
                className="text-xs text-slate-500 hover:text-slate-700 mt-2 flex items-center gap-1 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-200 transition-all"
              >
                <span>{showAssetDetails ? '🔒 隱藏資產與貸款細節' : '👁️ 查看資產與貸款細節'}</span>
              </button>
            </div>
            
            {/* 視角切換按鈕 */}
            <div className="flex bg-slate-100 p-1 rounded-xl">
              <button 
                onClick={() => setViewMode('joint')}
                className={`px-4 py-2 text-sm font-medium rounded-lg transition-all ${viewMode === 'joint' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                🌐 合併總覽
              </button>
              <button 
                onClick={() => setViewMode('mine')}
                className={`px-4 py-2 text-sm font-medium rounded-lg transition-all ${viewMode === 'mine' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                👤 我的帳本
              </button>
              <button 
                onClick={() => setViewMode('spouse')}
                className={`px-4 py-2 text-sm font-medium rounded-lg transition-all ${viewMode === 'spouse' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
              >
                👨‍💼 先生帳本
              </button>
            </div>
          </div>

          {/* 折疊收合的資產區域 */}
          {showAssetDetails && (
            <div className="bg-slate-100 p-4 rounded-xl border border-slate-200 text-xs text-slate-600 mb-6 space-y-1 animate-fadeIn">
              <p>📍 <strong>不動產項目：</strong>{data.houseName}</p>
              <p>💰 <strong>剩餘貸款：</strong>${data.mortgageRemaining.toLocaleString()} 元 (利率 2.185%)</p>
              <p>🏠 <strong>居住現況：</strong>醫院官舍 (月管理費 ${data.quartersFee.toLocaleString()})</p>
            </div>
          )}

          {/* 核心數據卡片 */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-sm font-medium text-slate-500">當前視角總流入 (月)</span>
              <p className="text-2xl font-bold text-emerald-600 mt-1">${currentIncome.toLocaleString()}</p>
              <p className="text-xs text-slate-400 mt-1">{viewMode === 'joint' ? '含租金收入 $42,000' : '已扣預扣所得稅/健保'}</p>
            </div>
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-sm font-medium text-slate-500">固定與預提扣繳 (月)</span>
              <p className="text-2xl font-bold text-rose-500 mt-1">${currentFixedExpense.toLocaleString()}</p>
              <p className="text-xs text-slate-400 mt-1">含官舍費/房貸利息/30%所得稅分攤/公共稅費</p>
            </div>
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <span className="text-sm font-medium text-slate-500">估計淨儲蓄 (月)</span>
              <p className="text-2xl font-bold text-sky-600 mt-1">${currentSavings.toLocaleString()}</p>
              <p className="text-xs text-slate-400 mt-1">扣除固定開銷與信用卡後淨額</p>
            </div>
          </div>

          {/* 房貸與租金對抵專區 (僅在總覽視角顯示) */}
          {viewMode === 'joint' && (
            <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-6 rounded-2xl shadow-md mb-6">
              <h2 className="text-lg font-bold mb-2">🏘️ 以房養房現金流對抵狀況</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-slate-200 text-sm mt-4">
                <div className="bg-white/10 p-3 rounded-xl">
                  <span className="block opacity-80">每月租金收入</span>
                  <span className="text-lg font-bold text-emerald-400">+${data.rentIncome.toLocaleString()}</span>
                </div>
                <div className="bg-white/10 p-3 rounded-xl">
                  <span className="block opacity-80">房貸每月利息 (2.185%)</span>
                  <span className="text-lg font-bold text-rose-300">-${monthlyInterest.toLocaleString()}</span>
                </div>
                <div className="bg-white/10 p-3 rounded-xl border border-emerald-500/30">
                  <span className="block opacity-80">淨租金溢額 (自動幫養房)</span>
                  <span className="text-lg font-bold text-emerald-300">+${netRentBenefit.toLocaleString()}</span>
                </div>
              </div>
            </div>
          )}

          {/* 快速填報與 30% 所得稅拆分詳細 */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* 左側：每月卡費動態輸入 */}
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <h3 className="text-base font-bold text-slate-900 mb-4">💳 本月信用卡結帳填報</h3>
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-600 mb-1">我的本月卡費金額</label>
                  <input 
                    type="number" 
                    value={myCard} 
                    onChange={(e) => setMyCard(Number(e.target.value))}
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-600 mb-1">先生本月卡費金額</label>
                  <input 
                    type="number" 
                    value={spouseCard} 
                    onChange={(e) => setSpouseCard(Number(e.target.value))}
                    className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
                  />
                </div>
              </div>
            </div>

            {/* 右側：所得稅 30% 級距與月平攤水庫 */}
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
              <h3 className="text-base font-bold text-slate-900 mb-2">🗓️ 所得稅 (30% 級距按 3:2 分攤) 與大額預提</h3>
              
              <div className="space-y-2 text-xs text-slate-600 mt-3">
                <div className="p-2.5 bg-slate-50 rounded-lg">
                  <div className="flex justify-between font-medium text-slate-800">
                    <span>👤 我的預提 (所得稅 2/5 + 牙材/學會/保費)：</span>
                    <span className="font-bold text-sky-700">${myMonthlyReserve.toLocaleString()} / 月</span>
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">含所得稅分攤 $18,000/月 ($216,000/年)</p>
                </div>

                <div className="p-2.5 bg-slate-50 rounded-lg">
                  <div className="flex justify-between font-medium text-slate-800">
                    <span>👨‍💼 先生預提 (所得稅 3/5 + 個人保費/規費)：</span>
                    <span className="font-bold text-sky-700">${spouseMonthlyReserve.toLocaleString()} / 月</span>
                  </div>
                  <p className="text-[11px] text-slate-400 mt-0.5">含所得稅分攤 $27,000/月 ($324,000/年)</p>
                </div>

                <div className="flex justify-between p-2 bg-slate-50 rounded-lg">
                  <span>🏠 家庭公共稅費(房屋/地價/車輛)預提：</span>
                  <span className="font-semibold text-slate-900">${jointMonthlyReserve.toLocaleString()} / 月</span>
                </div>
              </div>

              <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl mt-4">
                <span className="text-xs font-semibold text-amber-800 uppercase tracking-wider">
                  {viewMode === 'joint' ? '家庭每月總預提金額' : (viewMode === 'mine' ? '我的每月應預提金額' : '先生每月應預提金額')}
                </span>
                <p className="text-xl font-bold text-amber-900 mt-0.5">
                  ${(viewMode === 'joint' 
                      ? (jointMonthlyReserve + myMonthlyReserve + spouseMonthlyReserve)
                      : (viewMode === 'mine' ? myMonthlyReserve + Math.round(jointMonthlyReserve/2) : spouseMonthlyReserve + Math.round(jointMonthlyReserve/2))
                    ).toLocaleString()} / 月
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
